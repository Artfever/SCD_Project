apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb
  labels: { app: kb }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: kb }
  template:
    metadata:
      labels: { app: kb }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kb
          image: scd/kb:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: postgres }
            - { name: PGDATABASE, value: scd }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-auth, key: password }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { cpu: 1000m, memory: 1280Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: kb
  labels: { app: kb }
spec:
  selector: { app: kb }
  ports: [{ port: 8000, targetPort: 8000 }]
