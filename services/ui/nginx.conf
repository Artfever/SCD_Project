server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /health { default_type application/json; return 200 '{"status":"ok","service":"ui"}'; }
    location = /ready  { default_type application/json; return 200 '{"status":"ready","service":"ui"}'; }
    location / { try_files $uri $uri/ /index.html; }
}
